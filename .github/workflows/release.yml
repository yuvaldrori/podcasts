name: Build and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so `git rev-list --count HEAD` produces a monotonic versionCode.
          # Do not force-push/squash `main` or versionCode could decrease.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK 37.2
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.2
            ${{ env.ANDROID_HOME }}/build-tools/37.0.0
            ${{ env.ANDROID_HOME }}/licenses
          key: android-sdk-37.2-bt-37.0.0-v1

      - name: Install Android SDK 37.2
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tune Gradle JVM for CI (enable C2 JIT)
        run: |
          mkdir -p "$HOME/.gradle"
          cat <<'EOF' >> "$HOME/.gradle/gradle.properties"
          org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.awt.headless=true
          EOF

      - name: Verify (lint and unit tests)
        run: make ci-verify

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode release keystore
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          JKS_ALIAS: ${{ secrets.JKS_ALIAS }}
          JKS_PASSWORD: ${{ secrets.JKS_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE64 JKS_ALIAS JKS_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required repository secret: $var"
              exit 1
            fi
          done
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/android.jks")

      - name: Build release APK
        if: github.ref == 'refs/heads/main'
        env:
          JKS_PATH: ${{ runner.temp }}/android.jks
          JKS_ALIAS: ${{ secrets.JKS_ALIAS }}
          JKS_PASSWORD: ${{ secrets.JKS_PASSWORD }}
        run: make build-release

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/android.jks"

      - name: Verify signed APK and package release metadata
        if: github.ref == 'refs/heads/main'
        run: |
          METADATA_FILE="app/build/outputs/apk/release/output-metadata.json"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"

          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose "$APK_SRC"

          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$METADATA_FILE")
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$METADATA_FILE")

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 1 ]; then
            echo "::error::Invalid baked versionCode in $METADATA_FILE: '$VERSION_CODE'"
            exit 1
          fi
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "null" ] || [ "$VERSION_NAME" = "unknown" ]; then
            echo "::error::Invalid baked versionName in $METADATA_FILE: '$VERSION_NAME'"
            exit 1
          fi

          COMMIT_EPOCH=$(git show -s --format=%ct HEAD)
          BUILD_TIME=$(date -u -d "@${COMMIT_EPOCH}" +"%Y.%m.%d-%H:%M UTC")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          APK_NAME="podcasts-${VERSION_NAME}.apk"

          mkdir -p release-artifact
          cp "$APK_SRC" "release-artifact/${APK_NAME}"

          jq -n \
            --arg versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkName "$APK_NAME" \
            --arg buildTime "$BUILD_TIME" \
            --arg commitSha "$GITHUB_SHA" \
            --arg commitMsg "$COMMIT_MSG" \
            '{
              versionCode: ($versionCode | tonumber),
              versionName: $versionName,
              apkName: $apkName,
              buildTime: $buildTime,
              commitSha: $commitSha,
              commitMsg: $commitMsg
            }' > release-artifact/metadata.json

      - name: Upload release artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifact
          path: release-artifact/
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: release-artifact

      - name: Publish latest GitHub Release (zero-downtime)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=$(jq -r '.versionCode' release-artifact/metadata.json)
          VERSION_NAME=$(jq -r '.versionName' release-artifact/metadata.json)
          APK_NAME=$(jq -r '.apkName' release-artifact/metadata.json)
          BUILD_TIME=$(jq -r '.buildTime' release-artifact/metadata.json)
          COMMIT_SHA=$(jq -r '.commitSha' release-artifact/metadata.json)
          COMMIT_MSG=$(jq -r '.commitMsg' release-artifact/metadata.json)

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            'Automated release build from `main`.' \
            '' \
            "- **Commit:** \`${VERSION_NAME}\` (${COMMIT_SHA})" \
            "- **Build Time:** ${BUILD_TIME}" \
            "- **Version Code:** ${VERSION_CODE}" \
            '' \
            '### Latest Commit' \
            "${COMMIT_MSG}" > "$NOTES_FILE"

          TITLE="Latest (${BUILD_TIME} · ${VERSION_NAME})"

          if RELEASE_JSON=$(gh release view latest --json assets 2>&1); then
            # 1. Upload the new APK while body still advertises the previous Version Code.
            gh release upload latest "release-artifact/${APK_NAME}" --clobber

            # 2. Remove stale APK assets so only the new APK remains.
            printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name' | while IFS= read -r asset; do
              if [ -n "$asset" ] && [ "$asset" != "$APK_NAME" ] && [[ "$asset" == *.apk ]]; then
                gh release delete-asset latest "$asset" --yes
              fi
            done

            # 3. Move the rolling `latest` tag to the built commit and update release metadata.
            git tag -f latest "$COMMIT_SHA"
            git push -f origin refs/tags/latest

            gh release edit latest \
              --target "$COMMIT_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          elif printf '%s' "$RELEASE_JSON" | grep -qi "release not found"; then
            gh release create latest "release-artifact/${APK_NAME}" \
              --target "$COMMIT_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            echo "::error::Failed to inspect latest release: $RELEASE_JSON"
            exit 1
          fi
